services:
  seafile-mcp:
    build: .
    image: seafile-mcp:latest
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
      # Keeps OAuth clients and tokens across restarts.
      MCP_OAUTH_STATE_FILE: /data/oauth.json
    volumes:
      - oauth-data:/data
    ports:
      # Set MCP_PORT in .env to change the port (host and container).
      - "127.0.0.1:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    restart: unless-stopped

volumes:
  oauth-data:
